<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlbumVault — colección de álbumes</title>
  <meta name="description" content="Catálogo personal de álbumes con valoraciones de media estrella." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AlbumVault" />
  <meta property="og:title" content="AlbumVault — colección de álbumes" />
  <meta property="og:description" content="Catálogo personal de álbumes con valoraciones de media estrella." />
  <meta property="og:locale" content="es_ES" />
  <!-- Sin og:image: el único archivo que este servidor entrega es el propio
       documento, y una vista previa que apunte a /index.html es peor que no
       tener ninguna. El favicon de abajo es toda la superficie de marca. -->
  <meta name="twitter:card" content="summary" />

  <!-- La paleta se resuelve aquí, antes de pintar nada, para que al recargar
       nunca aparezca el tema equivocado. Tiene que ser un script aparte y
       pequeño: la app de React se monta al final del body, demasiado tarde. La
       clave de almacenamiento y los tres nombres de modo se repiten en
       src/lib/theme.js a propósito: mantén los dos en sintonía. -->
  <script>
    (() => {
      let mode = "system";
      try { mode = localStorage.getItem("albumvault.theme") || "system"; } catch (e) { /* sin almacenamiento: se sigue al sistema */ }
      if (mode !== "light" && mode !== "dark") mode = "system";
      const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.themeMode = mode;
    })();
  </script>
  <meta name="theme-color" content="#f4f1ea" />

  <!-- En línea porque el servidor solo sirve el documento compilado: un archivo
       favicon.ico daría 404 a propósito. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23141414'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%234a4a4a' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23c9a227'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23141414'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
